<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"></head>
<body>
<title>工作台流程模拟</title>
<meta name="description" content="不调用模型、按 v6 剧本演示 AI 协作战略工作台从新建项目到结论被下一条工作线用上的完整流程。">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eef0f3; --app: #fafafa; --surface: #ffffff; --surface-2: #f2f4f7; --ink: #18212d; --muted: #66707e; --line: #e1e5ea;
    --accent: #1f3b63; --accent-ink: #fff; --accent-soft: #e7eef8; --warn-soft: #fdf6e3; --warn-line: #f0dca6; --warn-ink: #7a5a12;
    --good: #1d7a4b; --good-soft: #e7f4ec; --bad-soft: #fdecec; --orange: #c2410c;
    --senior: #7c3aed; --senior-soft: #f3edff; --ja: #0b74c4; --ja-soft: #e6f2fb; --jb: #12855a; --jb-soft: #e6f5ee;
    --shadow: 0 1px 2px rgba(16,24,40,.06), 0 6px 20px rgba(16,24,40,.07);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0d1218; --app: #121922; --surface: #18212c; --surface-2: #1f2a37; --ink: #e7ecf2; --muted: #9aa6b4; --line: #2b3746;
      --accent: #8db2e8; --accent-ink: #0d1218; --accent-soft: #1c2b40; --warn-soft: #2c2514; --warn-line: #5c4a1c; --warn-ink: #e8c77d;
      --good: #6fcf9b; --good-soft: #14281d; --bad-soft: #301a1a; --orange: #f59e62;
      --senior: #b794f6; --senior-soft: #271d3d; --ja: #6cb6ee; --ja-soft: #142a3b; --jb: #6fcf9b; --jb-soft: #14281d;
      --shadow: 0 1px 2px rgba(0,0,0,.35), 0 6px 20px rgba(0,0,0,.3); color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0d1218; --app: #121922; --surface: #18212c; --surface-2: #1f2a37; --ink: #e7ecf2; --muted: #9aa6b4; --line: #2b3746;
    --accent: #8db2e8; --accent-ink: #0d1218; --accent-soft: #1c2b40; --warn-soft: #2c2514; --warn-line: #5c4a1c; --warn-ink: #e8c77d;
    --good: #6fcf9b; --good-soft: #14281d; --bad-soft: #301a1a; --orange: #f59e62;
    --senior: #b794f6; --senior-soft: #271d3d; --ja: #6cb6ee; --ja-soft: #142a3b; --jb: #6fcf9b; --jb-soft: #14281d;
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 6px 20px rgba(0,0,0,.3); color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font: 14px/1.6 "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; }
  .sim { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; height: 100vh; height: 100dvh; gap: 10px;
    padding: 10px max(14px, env(safe-area-inset-right, 0px)) 10px max(14px, env(safe-area-inset-left, 0px)); }

  /* narration */
  .narr { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 14px; align-items: baseline; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 16px; box-shadow: var(--shadow); }
  .narr .num { grid-row: span 2; font-size: 26px; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; line-height: 1.1; }
  .narr h1 { font-size: 17px; margin: 0; font-weight: 700; }
  .narr h1 small { font-weight: 400; color: var(--muted); font-size: 13px; margin-left: 10px; }
  .narr .cap { font-size: 15px; color: var(--accent); font-weight: 500; min-height: 1.6em; }
  .narr .cap::before { content: "▸ "; color: var(--muted); }

  /* product frame */
  .app { display: grid; grid-template-columns: 196px minmax(0, 1fr); min-height: 0; background: var(--app); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; box-shadow: var(--shadow); border-top: 4px solid var(--role, var(--senior)); transition: border-color .4s; }
  .side { border-right: 1px solid var(--line); background: var(--surface); padding: 14px 10px; display: flex; flex-direction: column; gap: 2px; min-height: 0; overflow: hidden; font-size: 13px; }
  .side .brand { font-weight: 700; padding: 0 8px 10px; }
  .side .nav { padding: 3px 8px; border-radius: 6px; color: var(--ink); display: flex; justify-content: space-between; }
  .side .nav.on { background: var(--surface-2); font-weight: 500; }
  .side .grp { color: var(--muted); font-size: 11px; padding: 10px 8px 2px; }
  .badge { background: var(--orange); color: #fff; border-radius: 999px; font-size: 11px; padding: 0 6px; line-height: 18px; }
  .who-box { margin-top: auto; border-top: 1px solid var(--line); padding: 10px 6px 0; }
  .who-box .lbl { color: var(--muted); font-size: 11px; margin-bottom: 4px; }
  .who-chip { border-radius: 8px; padding: 4px 10px; font-size: 13px; background: var(--role-soft); color: var(--role); border: 1px solid var(--role); transition: all .4s; }
  .screen { min-height: 0; overflow: auto; padding: 14px 18px; position: relative; }

  /* generic product pieces */
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
  .pad { padding: 12px 14px; }
  .muted { color: var(--muted); }
  .small { font-size: 12px; }
  .btn { border: 1px solid var(--line); background: var(--surface); border-radius: 7px; padding: 5px 12px; cursor: default; font-size: 13px; white-space: nowrap; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .pill { display: inline-block; border-radius: 999px; padding: 0 8px; font-size: 11px; line-height: 20px; border: 1px solid var(--line); background: var(--surface-2); color: var(--muted); white-space: nowrap; }
  .pill.blue { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
  .pill.green { background: var(--good-soft); color: var(--good); border-color: transparent; }
  .pill.amber { background: var(--warn-soft); color: var(--warn-ink); border-color: var(--warn-line); }
  .pill.orange { color: var(--orange); background: transparent; border-color: var(--orange); }
  h2 { font-size: 18px; margin: 0; }
  h3 { font-size: 14px; margin: 0 0 6px; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: left; vertical-align: top; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  .grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 12px; min-height: 0; }
  .grid2.even { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .pane { display: flex; flex-direction: column; min-height: 0; }
  .pane-h { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--line); font-weight: 500; font-size: 13px; }
  .pane-h .sp { margin-left: auto; }
  .pane-b { padding: 10px 12px; overflow: auto; min-height: 0; flex: 1; }
  .ws { display: grid; grid-template-rows: auto auto auto minmax(0, 1fr); gap: 10px; height: 100%; }
  .ws.full { height: auto; }
  .ws-head { display: flex; gap: 12px; align-items: flex-start; }
  .ws-head .crumb { font-size: 11px; color: var(--muted); }
  .ws-head .sub { font-size: 12px; color: var(--muted); }
  .ws-head .seg { margin-left: auto; display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; font-size: 13px; }
  .ws-head .seg span { padding: 4px 12px; color: var(--muted); }
  .ws-head .seg span.on { background: var(--surface); color: var(--ink); font-weight: 500; }
  .tag { display: inline-block; border: 1px solid var(--ja); color: var(--ja); background: var(--ja-soft); border-radius: 5px; padding: 0 6px; font-size: 11px; }
  .tag.b { border-color: var(--jb); color: var(--jb); background: var(--jb-soft); }
  .steps { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
  .steps div { border: 1px solid var(--line); border-radius: 7px; padding: 4px 8px; font-size: 12px; background: var(--surface); color: var(--muted); line-height: 1.35; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .steps div small { display: block; font-size: 10.5px; }
  .steps div.done { color: var(--ink); }
  .steps div.done b::before { content: "✓ "; color: var(--good); }
  .steps div.cur { border-color: var(--accent); background: var(--accent-soft); color: var(--ink); }
  .steps b { font-weight: 500; }
  .nextbar { display: flex; align-items: center; gap: 10px; border: 1px solid var(--accent); background: var(--accent-soft); border-radius: 9px; padding: 7px 12px; font-size: 13px; }
  .nextbar .t { flex: 1; }
  .nextbar .t::before { content: "→ "; color: var(--accent); }
  .banner { background: var(--warn-soft); border-bottom: 1px solid var(--warn-line); padding: 8px 12px; font-size: 12.5px; color: var(--warn-ink); }
  .banner b { display: block; color: var(--ink); font-weight: 500; }

  /* chat */
  .chat { display: flex; flex-direction: column; gap: 10px; }
  .msg .who { font-size: 11px; color: var(--muted); margin-bottom: 3px; }
  .msg.user { align-self: flex-end; max-width: 88%; display: flex; flex-direction: column; align-items: flex-end; }
  .msg.user .bubble { background: var(--surface-2); border-radius: 10px; padding: 7px 11px; white-space: pre-wrap; margin: 0; }
  .msg.ai .ai-text { white-space: pre-wrap; }
  .tool { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; background: var(--surface); font-size: 13px; }
  .tool .d { color: var(--muted); font-size: 12px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tool .st { font-size: 12px; color: var(--muted); }
  .tool .st.ok { color: var(--good); }
  .ask { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 10px 12px; }
  .ask[data-state="open"] { border-color: var(--accent); }
  .ask .h { display: flex; justify-content: space-between; font-size: 13px; font-weight: 500; margin-bottom: 4px; }
  .ask .h span { font-weight: 400; color: var(--muted); font-size: 12px; }
  .ask .q { margin: 0 0 8px; }
  .ask .opts { display: flex; flex-direction: column; gap: 6px; }
  .ask .opt { text-align: left; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; background: var(--surface); cursor: default; }
  .ask .opt.sel { border-color: var(--accent); background: var(--accent-soft); }
  .ask .ans { font-size: 13px; }
  .ask .ans small { color: var(--muted); display: block; }
  .composer { border-top: 1px solid var(--line); padding: 8px 10px; display: flex; gap: 8px; align-items: center; }
  .composer .in { flex: 1; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; color: var(--muted); background: var(--surface); min-height: 34px; white-space: pre-wrap; overflow: hidden; }
  .composer .in.typing { color: var(--ink); }
  .proposal { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--surface); }

  /* docs */
  .doc dl { margin: 0; display: grid; gap: 6px; }
  .doc dt { font-size: 11.5px; color: var(--muted); }
  .doc dd { margin: 0; }
  .branch { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin-top: 8px; background: var(--surface); }
  .branch .bt { font-size: 12px; color: var(--muted); }
  .sq { margin-top: 5px; font-size: 13px; }
  .sq .hy { color: var(--muted); font-size: 12.5px; }
  .ko { color: var(--orange); font-size: 12px; }
  .chg { border: 1px solid var(--line); border-left: 3px solid var(--senior); border-radius: 8px; padding: 8px 10px; background: var(--surface); }
  .mark { background: var(--warn-soft); border-radius: 3px; padding: 0 2px; }
  .fact { font-size: 11px; border-radius: 4px; padding: 0 5px; background: var(--good-soft); color: var(--good); margin-right: 4px; }
  .infer { font-size: 11px; border-radius: 4px; padding: 0 5px; background: var(--warn-soft); color: var(--warn-ink); margin-right: 4px; }
  .fn { font-size: 10.5px; vertical-align: super; color: var(--accent); border: 1px solid var(--accent); border-radius: 4px; padding: 0 3px; margin-left: 2px; cursor: default; }
  .sowhat { background: var(--surface-2); border-left: 3px solid var(--accent); border-radius: 6px; padding: 8px 12px; font-weight: 500; }
  .reason { border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; margin-top: 6px; background: var(--surface); }
  .cite { border: 1px solid var(--accent); border-radius: 10px; background: var(--surface); padding: 10px 12px; margin-top: 10px; }
  .cite blockquote { margin: 4px 0; padding: 6px 10px; background: var(--surface-2); border-left: 3px solid var(--line); border-radius: 4px; }
  .checks { display: grid; gap: 2px; font-size: 12.5px; }
  .file-group h4 { font-size: 13px; margin: 10px 0 4px; font-weight: 500; }
  .frow { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 7px; padding: 5px 10px; background: var(--surface); margin-top: 4px; font-size: 13px; transition: opacity .3s; }
  .frow .cb { width: 14px; height: 14px; border-radius: 3px; border: 1.5px solid var(--accent); background: var(--accent); flex: none; position: relative; }
  .frow .cb::after { content: "✓"; color: var(--accent-ink); font-size: 10px; position: absolute; left: 2px; top: -3px; }
  .frow .cb.off { background: transparent; }
  .frow .cb.off::after { content: ""; }
  .frow .cb.fixed { opacity: .45; }
  .frow.off .nm { color: var(--muted); text-decoration: line-through; }
  .frow .star { color: var(--muted); cursor: default; }
  .frow .star.on { color: #f59e0b; }
  .frow .nm { flex: 1; }
  .frow .gr { font-size: 11.5px; color: var(--muted); }
  .runbar { display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 4px; }
  .runbar i { height: 6px; border-radius: 3px; background: var(--line); transition: background .3s; }
  .runbar i.on { background: var(--good); }
  .runlabels { display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 4px; font-size: 11px; color: var(--muted); text-align: center; }
  .logrow { border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; background: var(--surface); font-size: 13px; }
  .logrow b { font-weight: 500; }
  .logrow .j { color: var(--muted); font-size: 12.5px; }
  .field { border: 1px solid var(--line); border-radius: 7px; padding: 6px 10px; min-height: 34px; background: var(--surface); white-space: pre-wrap; }
  .hidden { display: none !important; }
  .fade-in { animation: fade .45s ease both; }
  @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .flash { animation: flash 1.6s ease; }
  @keyframes flash { 0%, 100% { box-shadow: 0 0 0 0 transparent; } 30% { box-shadow: 0 0 0 4px rgba(245, 158, 11, .45); } }
  .pulse { position: relative; z-index: 2; animation: pulse 1.3s ease-in-out infinite; cursor: pointer !important; }
  @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, .0); } 50% { box-shadow: 0 0 0 5px rgba(245, 158, 11, .55); } }
  .press { transform: scale(.96); transition: transform .12s; }
  .modal-back { position: absolute; inset: 0; background: rgba(15, 20, 28, .35); display: grid; place-items: center; z-index: 5; }
  .modal { width: min(520px, 92%); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 14px 16px; display: grid; gap: 8px; }
  .toast { position: absolute; right: 16px; bottom: 14px; background: var(--ink); color: var(--app); border-radius: 8px; padding: 6px 12px; font-size: 13px; z-index: 6; }
  .cards3 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .proj-card { padding: 10px 14px; }
  .proj-card .q { color: var(--muted); font-size: 13px; }
  .tree { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .tree .line { border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; background: var(--surface); }
  .tree .it { display: flex; justify-content: space-between; font-size: 13px; padding: 1px 0; }
  .kv { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px 14px; font-size: 13px; }
  .kv dt { font-size: 11.5px; color: var(--muted); }
  .kv dd { margin: 0; }
  .end { max-width: 980px; margin: 0 auto; display: grid; gap: 12px; }

  /* presenter controls */
  .ctl { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .cbtn { all: unset; box-sizing: border-box; cursor: pointer; border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 7px 14px; font-size: 14px; box-shadow: var(--shadow); }
  .cbtn:hover { background: var(--surface-2); }
  .cbtn:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .cbtn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 500; }
  .cbtn[disabled] { opacity: .4; cursor: default; }
  .ctl select { font: inherit; font-size: 13px; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
  .ctl .pos { color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .ctl .grow { flex: 1; }
  .ctl .hint { color: var(--muted); font-size: 12px; }
  kbd { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; background: var(--surface); }

  @media (max-width: 900px) {
    .sim { height: auto; min-height: 100vh; }
    .app { grid-template-columns: minmax(0, 1fr); }
    .side { display: none; }
    .grid2, .grid2.even, .tree, .cards3 { grid-template-columns: minmax(0, 1fr) !important; }
    .grid2 { height: auto !important; }
    .screen [style*="display:flex"] { flex-wrap: wrap; }
    .steps { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .kv { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
    .ws { height: auto; }
    .pane-b { max-height: 60vh; }
    .ctl .hint { display: none; }
    .narr .num { font-size: 20px; }
  }
</style>

<div class="sim">
  <section class="narr" aria-live="polite">
    <div class="num" id="n-num"></div>
    <h1 id="n-title"></h1>
    <div class="cap" id="n-cap"></div>
  </section>

  <div class="app" id="app">
    <aside class="side" aria-hidden="true">
      <div class="brand">AI 协作战略工作台</div>
      <div class="nav" data-nav="home">首页</div>
      <div class="nav" data-nav="inbox">待你处理 <span class="badge hidden" id="inbox-badge">1</span></div>
      <div class="grp">项目</div>
      <div class="nav">东南亚中小企业渠道</div>
      <div class="nav" data-nav="proj" id="nav-proj">个人AI战略</div>
      <div class="nav">商用 PC 换机策略</div>
      <div class="nav">AI 服务器本地部署</div>
      <div class="grp"></div>
      <div class="nav">团队资料库</div>
      <div class="nav" data-nav="config">方法与配置</div>
      <div class="who-box"><div class="lbl">当前身份</div><div class="who-chip" id="who"></div></div>
    </aside>
    <main class="screen" id="screen"></main>
  </div>

  <nav class="ctl" aria-label="演示控制">
    <button class="cbtn" id="prev" type="button">← 上一步</button>
    <button class="cbtn primary" id="next" type="button">下一步 →</button>
    <button class="cbtn" id="play" type="button">▶ 自动播放</button>
    <select id="speed" aria-label="速度"><option value="0.7">慢</option><option value="1" selected>正常</option><option value="1.8">快</option></select>
    <select id="jump" aria-label="跳到"></select>
    <span class="pos" id="pos"></span>
    <span class="grow"></span>
    <span class="hint">闪烁的按钮可以直接点 · <kbd>→</kbd> 下一步 · <kbd>←</kbd> 上一步 · <kbd>P</kbd> 播放/暂停</span>
  </nav>
</div>

<script>
/* ---------- engine ---------- */
const S = { scene: 0, beat: 0, running: false, rush: false, instant: false, playing: false, speed: 1, gen: 0 };
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const waiters = new Set();
function sleep(ms) {
  if (S.instant || S.rush) return Promise.resolve();
  return new Promise((res) => {
    const done = () => { clearTimeout(t); waiters.delete(done); res(); };
    const t = setTimeout(done, ms / S.speed);
    waiters.add(done);
  });
}

const screen = () => $('#screen');
function scrollDown(el) { const box = el.closest('.pane-b') || el.closest('.screen'); if (box) box.scrollTop = box.scrollHeight; }
async function stream(el, text, cps = 70) {
  if (S.instant || S.rush) { el.textContent = text; scrollDown(el); return; }
  el.textContent = '';
  for (let i = 0; i < text.length; i += 3) {
    if (S.rush) break;
    el.textContent = text.slice(0, i + 3);
    if (i % 30 === 0) scrollDown(el);
    await sleep(3000 / cps);
  }
  el.textContent = text;
  scrollDown(el);
}
function add(container, html) {
  const box = typeof container === 'string' ? $(container) : container;
  box.insertAdjacentHTML('beforeend', html);
  const el = box.lastElementChild;
  if (!S.instant) el.classList.add('fade-in');
  scrollDown(el);
  return el;
}
function flash(sel) { if (S.instant) return; for (const el of $$(sel)) { el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); el.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); } }

function lastOpt(i) { return $$('.ask[data-state="open"]').at(-1)?.querySelectorAll('.opt')[i] ?? null; }
function applyNext() { const n = $('#nextbar[data-t]', screen()); if (n) nextbar(n.dataset.t, n.dataset.b, n.dataset.i); }

/* ---------- runner ---------- */
function resolveAct(act) { return typeof act === 'function' ? act() : $(act, screen()); }
function clearPulse() { for (const el of $$('.pulse')) el.classList.remove('pulse'); }
function pulseNext() {
  clearPulse();
  const sc = SCENES[S.scene];
  const b = sc.beats[S.beat];
  const el = b?.act ? resolveAct(b.act) : null;
  if (el) { el.classList.add('pulse'); el.scrollIntoView({ block: 'nearest' }); }
}
function narr(cap) {
  const sc = SCENES[S.scene];
  $('#n-num').textContent = sc.num;
  $('#n-title').innerHTML = `${esc(sc.title)}<small>${esc(sc.why)}</small>`;
  $('#n-cap').textContent = cap ?? (sc.beats[0]?.cap ? `下一步：${sc.beats[0].cap}` : '演示结束');
}
function updateControls() {
  const last = SCENES.length - 1;
  const total = SCENES[S.scene].beats.length;
  $('#prev').disabled = S.scene === 0 && S.beat === 0;
  $('#next').disabled = S.scene === last && S.beat >= total;
  $('#next').textContent = S.beat >= total && S.scene < last ? `进入 ${SCENES[S.scene + 1].num} →` : '下一步 →';
  $('#pos').textContent = `${S.scene + 1}/${SCENES.length} · 第 ${Math.min(S.beat, total)}/${total} 拍`;
  $('#jump').value = String(S.scene);
  $('#play').textContent = S.playing ? '⏸ 暂停' : '▶ 自动播放';
}
async function enterScene(i, beats = 0) {
  if (S.task) { hurry(); await S.task; }
  const gen = ++S.gen;
  S.scene = i; S.beat = 0; S.rush = false;
  const sc = SCENES[i];
  setRole(sc.role); setNav(sc.nav); inboxBadge(false);
  screen().innerHTML = sc.build(); applyNext();
  screen().scrollTop = 0;
  if (beats > 0) {
    S.instant = true;
    for (let k = 0; k < beats && k < sc.beats.length; k++) { await sc.beats[k].run?.(); S.beat = k + 1; }
    S.instant = false;
  }
  if (gen !== S.gen) return;
  narr(S.beat > 0 ? sc.beats[S.beat - 1].cap : undefined);
  updateControls(); pulseNext();
}
async function next() {
  if (S.running) { hurry(); return; }
  const sc = SCENES[S.scene];
  if (S.beat >= sc.beats.length) { if (S.scene < SCENES.length - 1) await enterScene(S.scene + 1); return; }
  const b = sc.beats[S.beat];
  const gen = S.gen;
  S.running = true; clearPulse(); narr(b.cap);
  const el = b.act ? resolveAct(b.act) : null;
  if (el && !S.rush) { el.classList.add('press'); await sleep(220); el.classList.remove('press'); }
  S.task = Promise.resolve(b.run?.()).catch((e) => console.error(e));
  await S.task;
  S.task = null; S.running = false; S.rush = false;
  if (gen !== S.gen) return;
  S.beat++;
  updateControls(); pulseNext();
}
function prev() {
  S.playing = false;
  if (S.beat > 0) enterScene(S.scene, S.beat - 1);
  else if (S.scene > 0) enterScene(S.scene - 1, SCENES[S.scene - 1].beats.length);
}
async function play() {
  if (S.playing) { S.playing = false; updateControls(); return; }
  S.playing = true; updateControls();
  while (S.playing) {
    const sc = SCENES[S.scene];
    if (S.scene === SCENES.length - 1 && S.beat >= sc.beats.length) break;
    const sceneEnd = S.beat >= sc.beats.length;
    await next();
    if (!S.playing) break;
    // time to read the caption before the next beat
    await sleep(sceneEnd ? 1800 : 1200 + ($('#n-cap').textContent.length * 45));
  }
  S.playing = false; updateControls();
}

$('#jump').innerHTML = SCENES.map((s, i) => `<option value="${i}">${esc(s.num)} ${esc(s.title.split('：')[0])}</option>`).join('');
$('#jump').addEventListener('change', (e) => { S.playing = false; enterScene(Number(e.target.value)); });
$('#next').addEventListener('click', () => { S.playing = false; next(); });
$('#prev').addEventListener('click', prev);
$('#play').addEventListener('click', play);
$('#speed').addEventListener('change', (e) => { S.speed = Number(e.target.value); });
$('#screen').addEventListener('click', (e) => { if (e.target.closest('.pulse')) { S.playing = false; next(); } });
document.addEventListener('keydown', (e) => {
  if (e.altKey || e.ctrlKey || e.metaKey || e.target.matches('select')) return;
  if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); S.playing = false; next(); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); prev(); }
  else if (e.key === 'p' || e.key === 'P') play();
});
enterScene(0);
</script>
